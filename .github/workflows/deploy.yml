name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Release gate: fails the deploy if withheld or confidential content,
      # an outdated title, or the retired domain reaches the bundle.
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Content audit
        run: npm run audit:content

      # A 404 here means a linked repository went private again. That is a
      # broken promise on a public CV, so it fails the deploy rather than
      # shipping a dead link.
      - name: Link check
        run: npm run checklinks

      # The Ask panel is a retrieval system on a page that claims retrieval
      # evaluation as a specialism. Shipping it unmeasured would undercut the
      # claim, so recall@3 is gated here.
      - name: Retrieval eval
        run: npm run eval:retrieval

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
