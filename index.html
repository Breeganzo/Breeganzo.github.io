<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anthony Breeganzo Thomas — AI Engineer</title>

      name="description"
      content="AI Engineer at Kyndryl. Production generative-AI systems: RAG pipeline design, multi-agent orchestration, and retrieval evaluation. Quantitative research alongside."
    />
    <link rel="canonical" href="https://breeganzo.github.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Anthony Breeganzo Thomas — AI Engineer" />
    <meta
      property="og:description"
      content="Production generative-AI systems: RAG pipeline design, multi-agent orchestration, and retrieval evaluation. Quantitative research alongside."
    />
    <meta property="og:url" content="https://breeganzo.github.io/" />
    <!--
      og.jpg is a purpose-built 1200x630 card (source: scripts/og-card.html),
      not the raw square portrait. A square image fed to a 1.91:1 slot gets
      centre-cropped by LinkedIn and X, which decapitates the subject. The
      explicit width/height let scrapers reserve the right box before the
      image downloads, and summary_large_image is what actually renders the
      wide card instead of a thumbnail.
    -->
    <meta property="og:image" content="https://breeganzo.github.io/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Anthony Breeganzo Thomas, AI Engineer at Kyndryl — RAG, multi-agent orchestration, retrieval evaluation"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://breeganzo.github.io/og.jpg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/profile.jpg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f7fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090c" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint so the theme never flashes. A stored
      // choice wins; otherwise follow the operating system.
      try {
        var stored = localStorage.getItem('theme')
        var dark =
          stored === 'dark' || stored === 'light'
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Anthony Breeganzo Thomas",
        "jobTitle": "AI Engineer",
        "url": "https://breeganzo.github.io/",
        "image": "https://breeganzo.github.io/profile.jpg",
        "email": "mailto:anthonybreeganzo02@gmail.com",
        "worksFor": { "@type": "Organization", "name": "Kyndryl" },
        "address": { "@type": "PostalAddress", "addressLocality": "Bangalore", "addressCountry": "IN" },
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "Queen Mary University of London" },
          { "@type": "CollegeOrUniversity", "name": "Reva University" }
        ],
        "sameAs": ["https://github.com/Breeganzo", "https://www.linkedin.com/in/breeganzo/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
